#
# Immich Docker Compose — based on the official Immich release compose:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Images are Immich’s official GHCR images + Valkey (Redis-compatible cache
# Immich ships in their install guide — not a third-party Immich fork).
#
# Project name is intentionally NOT "immich" so this stack can run beside an
# existing classic immich-app install (which uses container_name immich_*).
#
name: immich-docker

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Immich v3 binds to IMMICH_PORT inside the container (from env_file),
      # so host and container ports must match.
      - '${IMMICH_PORT:-2283}:${IMMICH_PORT:-2283}'
    depends_on:
      - redis
      - database
    restart: always
    # Do not set `healthcheck: disable: false` — Docker Compose treats that as
    # "use image HEALTHCHECK", but Podman errors: must define a healthcheck command.

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - ${MODEL_CACHE_LOCATION:-./data/model-cache}:/cache
    env_file:
      - .env
    restart: always

  redis:
    # Immich’s official compose uses Valkey (Redis protocol). Same role as Redis.
    image: docker.io/valkey/valkey:9
    volumes:
      - ${REDIS_DATA_LOCATION:-./data/redis}:/data
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
